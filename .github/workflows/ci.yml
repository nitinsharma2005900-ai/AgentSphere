name: AgentSphere CI/CD & AI Safety Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  python-ai-evaluations:
    name: Python AI Gateway, Safety Guardrails & Evaluations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install AI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai_service/requirements.txt

      - name: Run Pytest AI Gateway Suite
        run: |
          python -m pytest ai_service/tests -v

      - name: Run AI Safety & Injection Defenses Evaluation
        run: |
          python scripts/run_safety_evaluations.py

  node-backend-tests:
    name: Node.js Backend, RBAC & Tenant Isolation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run TypeScript Compile Check
        run: |
          cd backend
          npm run build

      - name: Run Backend Integration & Negative Multi-Tenant Isolation Tests
        run: |
          cd backend
          npm test

  frontend-build:
    name: Next.js Frontend Production Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Next.js Production Build
        run: |
          cd frontend
          npm run build

  docker-verification:
    name: Docker AI Infrastructure Validation
    needs: [python-ai-evaluations, node-backend-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
