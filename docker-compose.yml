version: "3.8"

services:
  # 1. PostgreSQL 16 with pgvector Extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentsphere-postgres
    restart: always
    environment:
      POSTGRES_DB: agentsphere_db
      POSTGRES_USER: agentsphere_user
      POSTGRES_PASSWORD: agentsphere_secure_password_2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentsphere_user -d agentsphere_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
    networks:
      - agentsphere-net

  # 2. Redis Caching & Queue Service
  redis:
    image: redis:7-alpine
    container_name: agentsphere-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - agentsphere-net

  # 3. Python FastAPI AI Inference & Document Ingestion Gateway
  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: agentsphere-ai-service
    restart: always
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_SERVICE_PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
    networks:
      - agentsphere-net

  # 4. Node.js Express Core Business Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentsphere-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgres://agentsphere_user:agentsphere_secure_password_2026!@postgres:5432/agentsphere_db
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000/api/v1
      JWT_SECRET: ${JWT_SECRET:-agentsphere-production-jwt-secret-key-32b!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-agentsphere-production-refresh-secret-32b!}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - agentsphere-net

  # 5. Next.js Obsidian Violet Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentsphere-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 20s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - agentsphere-net

volumes:
  postgres_data:
  redis_data:

networks:
  agentsphere-net:
    driver: bridge
