services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agentsphere
      POSTGRES_USER: agentsphere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U agentsphere -d agentsphere]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy noeviction
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m
  platform:
    build: .
    env_file: .env
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgres://agentsphere:${POSTGRES_PASSWORD}@postgres:5432/agentsphere
      REDIS_URL: redis://redis:6379
      RUN_WORKER: 'true'
      SEED_DEMO: 'true'
    ports: ['5000:5000']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 768m
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://platform:5000
    ports: ['3000:3000']
    depends_on: [platform]
    mem_limit: 512m
volumes:
  postgres_data:
  redis_data:
